# CI for the pure Go PDF port (internal/mupdf/pdf), its tests and the compare
# gate (test/compare). Runs on this branch and on pull requests into master.
#
# Jobs:
#   format          gofmt must report no changes
#   vet             go vet with CGO_ENABLED=0
#   lint            golangci-lint v2 (config: .golangci.yml)
#   test            unit and compare tests on Linux, macOS and Windows, no cgo
#   race            the same packages under the race detector (needs cgo for -race)
#   compare-gate    the compare gate against committed golden outputs, no cgo
#   purity          the pure packages contain no cgo files and pull in no purego
#   cross-build     the pure packages build for all six target platforms
#   golden-drift    regenerates goldens with the cgo reference and fails if they differ
#
# The pure packages must never import "C" or purego. The purity job enforces it.

name: Pure Go port

on:
  push:
    branches: [pure-go-port-harness]
  pull_request:
    branches: [master, pure-go-port-harness]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOLANGCI_LINT_VERSION: v2.1.6
  PURE_PACKAGES: ./internal/... ./test/...

jobs:
  format:
    name: gofmt
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: |
          unformatted="$(gofmt -l internal cmd test)"
          if [ -n "$unformatted" ]; then
            echo "Files need gofmt:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

  vet:
    name: go vet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet pure packages
        run: go vet ${{ env.PURE_PACKAGES }} ./cmd/...

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --config .golangci.yml ${{ env.PURE_PACKAGES }} ./cmd/...

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test pure packages
        run: go test -count=1 ${{ env.PURE_PACKAGES }}

  race:
    name: race detector
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test with -race
        run: go test -race -count=1 ${{ env.PURE_PACKAGES }}

  compare-gate:
    name: compare gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run compare gate
        run: go test -count=1 -v -run 'TestManifestCoversEveryMethod|TestCompareGate' ./test/compare/

  purity:
    name: pure Go only
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: No cgo files in pure packages
        run: |
          offenders="$(go list -f '{{if .CgoFiles}}{{.ImportPath}}{{end}}' ${{ env.PURE_PACKAGES }})"
          if [ -n "$offenders" ]; then
            echo "Packages with cgo files:" >&2
            echo "$offenders" >&2
            exit 1
          fi
      - name: No purego or runtime/cgo in the dependency graph
        env:
          CGO_ENABLED: "0"
        run: |
          deps="$(go list -deps ${{ env.PURE_PACKAGES }})"
          if echo "$deps" | grep -E '^github.com/ebitengine/purego|^runtime/cgo$'; then
            echo "Pure packages must not depend on purego or runtime/cgo" >&2
            exit 1
          fi

  cross-build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    env:
      CGO_ENABLED: "0"
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build pure packages
        run: go build ${{ env.PURE_PACKAGES }}

  golden-drift:
    name: golden drift (cgo reference)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Regenerate goldens with the reference
        run: go run ./cmd/fitz-compare testdata/test.pdf > "$RUNNER_TEMP/test.pdf.json"
      - name: Fail if committed goldens differ from the reference
        run: diff -u test/compare/golden/test.pdf.json "$RUNNER_TEMP/test.pdf.json"
